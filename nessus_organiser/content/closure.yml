title: Finding Closure Review

introduction: |
  The following findings are candidates for closure in the stated scope.
  These are suggested justifications, not automatic decisions. Review the
  affected systems, their exposure and applicable requirements before
  accepting the risk or closing a finding.

plugins:
  "10884":
    title: Network Time Protocol (NTP) Server Detection
    platform_id: SC-2101
    internal:
      commentary: |
        An NTP service on the internal network offers limited additional
        attack value and, by itself, does not demonstrate a path to
        compromise. Closure may be appropriate after checking for information
        disclosure, amplification functionality and vulnerable versions, and
        confirming that the service's exposure meets internal requirements.

      references:
        - https://www.tenable.com/plugins/nessus/10884

  "10114":
    title: ICMP Timestamp Request Remote Date Disclosure
    internal:
      commentary: |
        ICMP timestamp responses disclose system time but generally provide
        limited additional attack value in an internal network. Closure may
        be appropriate after confirming that the exposure does not materially
        affect time-based authentication and meets internal security
        requirements.

      references:
        - https://www.tenable.com/plugins/nessus/10114
        - https://www.rfc-editor.org/rfc/rfc792

  "35371":
    title: DNS Server hostname.bind Map Hostname Disclosure
    internal:
      commentary: |
        The hostname.bind response discloses the DNS server's hostname but
        does not itself provide a direct path to compromise. Closure may be
        appropriate in the internal environment after confirming that the
        hostname reveals no sensitive information and the exposure meets
        internal security requirements.

      references:
        - https://www.tenable.com/plugins/nessus/35371
        - https://www.rfc-editor.org/rfc/rfc4892
